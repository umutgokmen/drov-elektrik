[project]
name = "drov-python-api"
version = "1.0.0"
description = "Drov Elektrik - Drawing/CAD generation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.26.0",
    # Drawing engines
    "reportlab>=4.0.8",
    "ezdxf>=1.1.0",
    # Geometry
    "numpy>=1.26.0",
    "shapely>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.0",
]
cad = [
    "cadquery>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
